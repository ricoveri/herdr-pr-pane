[package]
name = "herdr-pr-pane"
version = "0.1.0"
edition = "2021"
description = "Orca-style PR pane (header, checks, comments) for herdr"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
